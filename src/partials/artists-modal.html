<section class="artists-modal">
  <div class="artists-modal-backdrop is-hidden-modal">
    <div class="artists-modal-window">
      <button class="artists-modal-window-btn" aria-label="Close">
        <svg
          width="32"
          height="32"
          viewBox="0 0 32 32"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M22.8353 22.364L22.3638 22.8354C22.1035 23.0957 21.6814 23.0957 21.421 22.8354L15.9999 17.4142L10.5787 22.8353C10.3184 23.0957 9.89626 23.0957 9.63591 22.8353L9.1645 22.3639C8.90415 22.1036 8.90415 21.6815 9.1645 21.4211L14.5857 16L9.1645 10.5788C8.90415 10.3185 8.90415 9.89638 9.1645 9.63603L9.6359 9.16463C9.89625 8.90428 10.3184 8.90428 10.5787 9.16463L15.9999 14.5858L21.421 9.16462C21.6814 8.90427 22.1035 8.90427 22.3638 9.16462L22.8353 9.63602C23.0956 9.89637 23.0956 10.3185 22.8353 10.5788L17.4141 16L22.8353 21.4211C23.0956 21.6815 23.0956 22.1036 22.8353 22.364Z"
            fill="currentColor"
          />
        </svg>
      </button>

      <div class="artists-modal-loader is-hidden-modal-loader">Loading...</div>

      <div class="artists-modal-window-content">
        <div class="artist-modal-top">
          <img src="" alt="Artist Image" class="artist-modal-img" />
          <div class="artist-modal-meta">
            <h2 class="artist-name">Name of Artist</h2>
            <p>
              <strong>Years active:</strong>
              <span class="artist-active-years"></span>
            </p>
            <p><strong>Sex:</strong> <span class="artist-gender"></span></p>
            <p>
              <strong>Members:</strong> <span class="artist-members"></span>
            </p>
            <p>
              <strong>Country:</strong> <span class="artist-country"></span>
            </p>
          </div>
        </div>

        <section class="artist-modal-bio">
          <h3>Biography</h3>
          <p class="artist-bio"></p>
        </section>

        <section class="artist-genres-section">
          <h3>Genres</h3>
          <ul class="artist-genres"></ul>
        </section>

        <section class="albums-section">
          <h3>Albums</h3>
          <div class="albums-container">
            <div class="album">
              <h4 class="album-title">Album Title</h4>
              <ul class="album-tracks">
                <li class="album-tracks-header">
                  <span>Track</span>
                  <span>Duration</span>
                  <span>Link</span>
                </li>
              </ul>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</section>
